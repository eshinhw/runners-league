name: RunnersLeagueSync
options:
  bundleIdPrefix: com.runnersleague
  deploymentTarget:
    iOS: "17.0"
targets:
  RunnersLeagueSync:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "Runners League reads your running workouts from Health to sync device-verified mileage into your Rankings."
        NSHealthUpdateUsageDescription: "Used only by the Simulator test-data button to write a sample workout for development."
    entitlements:
      path: Generated/RunnersLeagueSync.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runnersleague.sync
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
